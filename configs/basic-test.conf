# Basic DNS Load Test Configuration
# Light load testing for general performance assessment

# DNS Server to test
DNS_SERVER=prod-hk-stage-pdns-2-lb-41d2fb0caef906ae.elb.ap-east-1.amazonaws.com

# Query file to use
QUERY_FILE=queries/staging-queries.txt

# Test duration in seconds｀
DURATION=1800

# Queries per second
QPS=15000

# Number of concurrent connections
CONCURRENT=256

# Query timeout in seconds
TIMEOUT=15

# Additional dnsperf options｀
EXTRA_OPTIONS="-v"

# Enable dig benchmarking in parallel with dnsperf (true/false)
DIG_BENCH_ENABLED=true

# Domain to query for dig benchmarking (defaults to first line in QUERY_FILE if empty)
DIG_BENCH_DOMAIN=

# Interval between dig queries in seconds
DIG_BENCH_INTERVAL=1

# Resolver to use for dig (defaults to DNS_SERVER)
DIG_BENCH_RESOLVER=

# dig record type (A, AAAA, CNAME, etc.)
DIG_BENCH_TYPE=A

# Randomize dig benchmark domain selection from QUERY_FILE each sample (true/false)
DIG_BENCH_RANDOM=true

# Probe dnsperf (low-QPS user-like stream) settings
PROBE_ENABLED=true
# If empty, reuse QUERY_FILE; else provide a separate probe queries file
PROBE_QUERY_FILE=
# Low constant QPS for probe stream
PROBE_QPS=10
# Small concurrency to mimic end-user
PROBE_CONCURRENT=4
# Probe timeout (seconds)
PROBE_TIMEOUT=3
# Extra options for probe dnsperf (e.g., "-v")
PROBE_EXTRA_OPTIONS=""